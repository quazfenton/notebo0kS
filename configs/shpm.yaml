defaults:
  - override hydra/job_logging: disabled

# Data
data_path: null
data_format: null   # csv|jsonl|parquet
task_col: task
command_col: command

# Tokenizer/Model
auto_tokenizer:
  use_hf_tokenizer: false
  hf_tokenizer_name: google/flan-t5-small
  max_len: 64

# Model
vocab_size: 50000
d_model: 512
n_layers: 4
n_heads: 8
dropout: 0.1

# Training
epochs: 1
batch_size: 8
lr: 0.001
save_dir: outputs/shpm

# Logging
wandb_enable: false
wandb_project: shpm
wandb_run_name: null
