[project]
name = "warp-research"
version = "0.1.0"
description = "Advanced reward architectures: world-model + slot-program"
authors = [{name = "Research", email = "research@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.3",
  "torchvision>=0.18",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "Pillow>=10.2",
  "imageio>=2.34",
  "opencv-python>=4.10",
  "pyyaml>=6.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "rich>=13.7",
  "loguru>=0.7",
  "tqdm>=4.66",
  "tensorboard>=2.16",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "pyyaml-include>=1.3"
]

[tool.ruff]
line-length = 100
select = ["E","F","I","B","UP"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
